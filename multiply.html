<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiply Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.08),
            transparent 28%
          ),
          linear-gradient(180deg, #050505, #000000 45%, #070707);
        font-family: "Helvetica Neue", "SF Pro Display", Arial, sans-serif;
      }

      .calculator {
        width: min(92vw, 380px);
        padding: 24px 18px 20px;
        border-radius: 36px;
        border: 2px solid #3a3a3c;
        background: #1c1c1e;
        box-shadow:
          0 28px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      h1 {
        margin: 0 0 18px;
        color: #f5f5f7;
        font-size: 1.5rem;
        font-weight: 500;
        text-align: center;
      }

      .display {
        min-height: 96px;
        margin-bottom: 18px;
        padding: 12px 10px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        color: #f5f5f7;
        font-size: clamp(3rem, 8vw, 4.4rem);
        font-weight: 300;
        text-align: right;
        overflow: hidden;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        height: 76px;
        border: none;
        border-radius: 50%;
        font-size: 2rem;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }

      button:hover {
        transform: scale(1.03);
      }

      .number,
      .decimal,
      .clear {
        background: #f5f5f7;
        color: #1a1a1a;
      }

      .operator,
      .equals {
        background: #ff4fa3;
        color: #ffffff;
      }

      .zero {
        grid-column: span 2;
        border-radius: 999px;
        text-align: left;
        padding-left: 30px;
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1>Multiply Calculator</h1>
      <div class="display" id="display">0</div>

      <div class="buttons">
        <button class="clear" data-action="clear">AC</button>
        <button class="number" data-action="digit" data-value="7">7</button>
        <button class="number" data-action="digit" data-value="8">8</button>
        <button class="number" data-action="digit" data-value="9">9</button>

        <button class="number" data-action="digit" data-value="4">4</button>
        <button class="number" data-action="digit" data-value="5">5</button>
        <button class="number" data-action="digit" data-value="6">6</button>
        <button class="operator" data-action="operator">×</button>

        <button class="number" data-action="digit" data-value="1">1</button>
        <button class="number" data-action="digit" data-value="2">2</button>
        <button class="number" data-action="digit" data-value="3">3</button>
        <button class="equals" data-action="equals">=</button>

        <button class="number zero" data-action="digit" data-value="0">
          0
        </button>
        <button class="decimal" data-action="decimal">.</button>
      </div>
    </main>

    <script>
      const display = document.getElementById("display");
      const buttons = document.querySelectorAll("button");

      let currentInput = "0";
      let firstValue = null;
      let shouldResetDisplay = false;

      function updateDisplay() {
        display.textContent = currentInput;
      }

      function inputDigit(digit) {
        if (shouldResetDisplay) {
          currentInput = digit;
          shouldResetDisplay = false;
        } else {
          currentInput = currentInput === "0" ? digit : currentInput + digit;
        }

        updateDisplay();
      }

      function inputDecimal() {
        if (shouldResetDisplay) {
          currentInput = "0.";
          shouldResetDisplay = false;
        } else if (!currentInput.includes(".")) {
          currentInput += ".";
        }

        updateDisplay();
      }

      function clearAll() {
        currentInput = "0";
        firstValue = null;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function chooseMultiply() {
        firstValue = Number(currentInput);
        shouldResetDisplay = true;
      }

      function calculateResult() {
        if (firstValue === null) {
          return;
        }

        currentInput = String(firstValue * Number(currentInput));
        firstValue = null;
        shouldResetDisplay = true;
        updateDisplay();
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          const value = button.dataset.value;

          if (action === "digit") inputDigit(value);
          if (action === "decimal") inputDecimal();
          if (action === "clear") clearAll();
          if (action === "operator") chooseMultiply();
          if (action === "equals") calculateResult();
        });
      });
    </script>
  </body>
</html>
